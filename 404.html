<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Freelance Easy</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("fe-theme");
          if (t === "light")
            document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="doc" style="text-align: center">
      <h1 style="font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: clamp(56px, 10vw, 120px); margin-bottom: 8px">404</h1>
      <p class="muted" style="font-size: 18px">
        That page doesn't exist — or hasn't been written yet.
      </p>
      <p style="margin-top: 32px">
        <a class="btn btn-primary" href="/" style="display: inline-flex">
          <span class="label"><span class="bot">Back to Freelance Easy</span></span>
        </a>
      </p>
    </main>
  </body>
</html>
