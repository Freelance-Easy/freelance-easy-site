    <!-- fe-shell:head (B2): the theme + shell head, byte-identical on every page that includes partials/head.html -->
    <script>
      (function () {
        // the theme: #dark / #light first, then the visitor's stored choice (fe-theme, shared with the other pages),
        // then this visit's theme from /mac (fe-theme-visit, the audio pages' contract), else dark
        var d = document.documentElement, t = null, h = location.hash.slice(1);
        if (h === "dark" || h === "light") t = h;
        if (!t) { try { t = localStorage.getItem("fe-theme"); } catch (e) { t = null; } }
        if (t !== "dark" && t !== "light") { try { t = sessionStorage.getItem("fe-theme-visit"); } catch (e) { t = null; } }
        d.setAttribute("data-theme", t === "light" ? "light" : "dark");
        var calm = false;
        try { calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { calm = false; }
        // a short touch screen (a phone with its browser bars, or any phone held sideways: under 600 px of small
        // viewport) gets the stacked beats too: a pinned stage plus its caption would leave a thumbnail. Touch only
        // (pointer: coarse), so a desktop window is never affected. site.js re-checks on rotation (the same test).
        var short = false;
        if (!calm) {
          try {
            if (window.matchMedia("(pointer: coarse)").matches) {
              var pr = document.createElement("div");
              pr.style.cssText = "position:fixed;left:0;top:0;width:0;height:100svh;visibility:hidden;pointer-events:none";
              d.appendChild(pr);
              var sv = pr.getBoundingClientRect().height || window.innerHeight;
              d.removeChild(pr);
              short = sv < 600;
            }
          } catch (e) { short = false; }
        }
        d.classList.remove("no-js");
        d.classList.add("js", calm || short ? "calm" : "motion");
        if (short) d.classList.add("short-touch");
        // a safety net: if the engine never comes up, the beats fall back to their stacked, static layout
        setTimeout(function () { if (!d.classList.contains("fx-ready")) d.classList.remove("motion", "calm"); }, 4000);
      })();
    </script>
    <!-- fe-classic (K1): the visitor's remembered view decides calm or motion before the first paint, over the
         reduced-motion query: "1" = Classic (calm), "0" = the story. A short touch screen stays calm either way, and is
         marked calm-auto (the Classic switch is not shown there: calm is automatic). -->
    <script>
      (function () {
        var d = document.documentElement, c = null, short = false;
        try {
          if (window.matchMedia("(pointer: coarse)").matches) {
            var pr = document.createElement("div");
            pr.style.cssText = "position:fixed;left:0;top:0;width:0;height:100svh;visibility:hidden;pointer-events:none";
            d.appendChild(pr);
            short = (pr.getBoundingClientRect().height || window.innerHeight) < 600;
            d.removeChild(pr);
          }
        } catch (e) { short = false; }
        if (short) d.classList.add("calm-auto");
        try { c = localStorage.getItem("fe-classic"); } catch (e) { c = null; }
        if (c !== "1" && c !== "0") return;
        if (!d.classList.contains("motion") && !d.classList.contains("calm")) return;
        // "1": calm, as site.js's setClassic(true) leaves it (Classic by choice, not a short touch screen)
        if (c === "1") { d.classList.remove("motion", "short-touch"); d.classList.add("calm"); return; }
        // "0": only a page made calm by the reduced-motion query turns to the story, never a short touch screen
        if (!d.classList.contains("calm")) return;
        if (short) { d.classList.add("short-touch"); return; }
        d.classList.remove("calm"); d.classList.add("motion");
      })();
    </script>
    <!-- /fe-classic -->
