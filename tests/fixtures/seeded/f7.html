<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><title>F7 seed</title>
<style>
  body { background: #080a0f; color: #eee; font: 16px/1.5 sans-serif; margin: 0; }
  header { height: 60px; }
  [data-theme="light"] header { height: 90px; } /* header moves on theme switch */
  .late { height: 300px; background: #223; }
</style></head>
<body><header>head</header><main><h1>F7 seed</h1><p>Content that gets pushed down after load.</p></main>
<script>
  // late insertion above the content: a layout shift well over 0.02
  setTimeout(function () {
    var d = document.createElement("div"); d.className = "late";
    document.querySelector("main").prepend(d);
  }, 300);
</script></body>
</html>
