<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><title>F10 seed</title>
<style>
  body { background: #080a0f; color: #eee; font: 16px/1.5 sans-serif; }
  .spin { width: 20px; height: 20px; background: #6cf; animation: pulse 1s linear infinite; }
  @keyframes pulse { from { opacity: 1; } to { opacity: .4; } }
  /* no prefers-reduced-motion guard: the F10 flaw */
</style></head>
<body><main><h1>F10 seed</h1><div class="spin"></div></main></body>
</html>
